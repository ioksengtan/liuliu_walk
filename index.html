<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171614">
  <title>《散步溜溜》</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171614;
      --fg: #ebe6dc;
      --muted: #a39c92;
      --btn: #2c2926;
      --btn-fg: #f4efe6;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      text-align: center;
      padding: 0.7rem 1rem 0.15rem;
    }

    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    #status {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.35rem 0.75rem 0.15rem;
    }

    #stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
    }

    #page {
      max-width: 100%;
      max-height: calc(100dvh - 13rem);
      width: auto;
      height: auto;
      display: block;
      background: #100f0d;
      -webkit-user-drag: none;
      user-select: none;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      width: min(100%, 40rem);
      margin-top: 0.7rem;
    }

    button {
      flex: 1;
      appearance: none;
      border: 0;
      border-radius: 999px;
      min-height: 3rem;
      padding: 0.65rem 1rem;
      background: var(--btn);
      color: var(--btn-fg);
      font: inherit;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    button:focus-visible {
      outline: 2px solid #c9bfb0;
      outline-offset: 3px;
    }

    footer {
      padding: 0.45rem 0.75rem 0.75rem;
    }

    .overview {
      display: block;
      width: min(100%, 40rem);
      height: 3.25rem;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 4px;
    }

    .overview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 46%;
      display: block;
    }

    noscript p {
      margin: 0.5rem 1rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>《散步溜溜》</h1>
    <p id="status" aria-live="polite">封面　1 / 12</p>
  </header>
  <main>
    <div id="stage">
      <img id="page" alt="《散步溜溜》封面" src="print/00-cover.png" draggable="false">
    </div>
    <div class="controls">
      <button type="button" id="prev">上一頁</button>
      <button type="button" id="next">下一頁</button>
    </div>
  </main>
  <footer>
    <a class="overview" href="print/overview-3x4.jpg">
      <img src="print/overview-3x4.jpg" alt="十二頁總覽" loading="lazy" decoding="async">
    </a>
  </footer>
  <noscript>
    <p>翻頁需要 JavaScript。各頁圖在 print/ 資料夾。</p>
  </noscript>
  <script>
    (function () {
      var pages = [
        ["print/00-cover.png", "封面"],
        ["print/01-spread.png", "跨頁 1"],
        ["print/02-spread.png", "跨頁 2"],
        ["print/03-spread.png", "跨頁 3"],
        ["print/04-spread.png", "跨頁 4"],
        ["print/05-spread.png", "跨頁 5"],
        ["print/06-spread.png", "跨頁 6"],
        ["print/07-spread.png", "跨頁 7"],
        ["print/08-spread.png", "跨頁 8"],
        ["print/09-spread.png", "跨頁 9"],
        ["print/10-spread.png", "跨頁 10"],
        ["print/11-back.png", "封底"]
      ];

      var index = 0;
      var img = document.getElementById("page");
      var status = document.getElementById("status");
      var prev = document.getElementById("prev");
      var next = document.getElementById("next");
      var stage = document.getElementById("stage");

      function show(i) {
        index = Math.max(0, Math.min(pages.length - 1, i));
        var src = pages[index][0];
        var label = pages[index][1];
        img.src = src;
        img.alt = "《散步溜溜》" + label;
        status.textContent = label + "　" + (index + 1) + " / " + pages.length;
        prev.disabled = index === 0;
        next.disabled = index === pages.length - 1;
        var hash = "#" + (index + 1);
        if (location.hash !== hash) {
          history.replaceState(null, "", hash);
        }
        var ahead = pages[index + 1];
        if (ahead) {
          var pre = new Image();
          pre.src = ahead[0];
        }
      }

      prev.addEventListener("click", function () { show(index - 1); });
      next.addEventListener("click", function () { show(index + 1); });

      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          show(index - 1);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          show(index + 1);
        }
      });

      var startX = 0;
      var startY = 0;
      stage.addEventListener("touchstart", function (e) {
        var t = e.changedTouches[0];
        startX = t.clientX;
        startY = t.clientY;
      }, { passive: true });
      stage.addEventListener("touchend", function (e) {
        var t = e.changedTouches[0];
        var dx = t.clientX - startX;
        var dy = t.clientY - startY;
        if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
        show(index + (dx < 0 ? 1 : -1));
      }, { passive: true });

      var fromHash = parseInt(String(location.hash || "").replace("#", ""), 10);
      show(fromHash >= 1 && fromHash <= pages.length ? fromHash - 1 : 0);
    })();
  </script>
</body>
</html>
